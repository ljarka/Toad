name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Maven Central occasionally times out from runners; be patient and retry.
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=60000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=5

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # services.gradle.org sometimes stalls from runners; retry fetching Gradle.
      - name: Download Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying in 15 s"
            sleep 15
          done
          exit 1

      # verifyPaparazziDebug runs all unit tests and compares screenshots with the checked-in images.
      - name: Unit tests, screenshots, lint, build
        run: ./gradlew verifyPaparazziDebug lintDebug assembleDebug

      - name: Upload reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/paparazzi/failures/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: toad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
