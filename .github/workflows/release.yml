name: Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub release.
# Obtainium watches the releases of this repository.
on:
  push:
    tags: ["v*"]

env:
  # Maven Central occasionally times out from runners; be patient and retry.
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=60000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=5

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Download Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying in 15 s"
            sleep 15
          done
          exit 1

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the TOAD_KEYSTORE_BASE64 secret (see README, Releasing)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TOAD_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          TOAD_KEYSTORE_PASSWORD: ${{ secrets.TOAD_KEYSTORE_PASSWORD }}
          TOAD_KEY_ALIAS: ${{ secrets.TOAD_KEY_ALIAS }}
          TOAD_KEY_PASSWORD: ${{ secrets.TOAD_KEY_PASSWORD }}
          TOAD_VERSION_NAME: ${{ github.ref_name }}
          # Always increasing across releases.
          TOAD_VERSION_CODE: ${{ github.run_number }}0
          # anon/publishable key is public by design (RLS protects data); empty until Supabase exists.
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew verifyPaparazziDebug assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="toad-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Toad $GITHUB_REF_NAME" --generate-notes
